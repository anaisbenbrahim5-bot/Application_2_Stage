<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="mb-3 d-flex justify-content-center">
      <div class="d-flex align-items-center gap-2" style="width: 400px">
        <label class="form-label mb-0">Recherche par numero de carte:</label>
        <input [(ngModel)]="SearchNum" (input)="OnSearch()" type="text" class="form-control" />
      </div>
    </div>
    <div class="d-flex justify-content-center">
      <div class="table-responsive" style="width: 90%">
        <table class="table table-striped table-hover table-bordered align-middle">
          <thead>
            <tr class="table-dark text-center">
              <td class="fw-bold">date</td>
              <td class="fw-bold">hour</td>
              <td class="fw-bold">num_carte</td>
              <td class="fw-bold">component</td>
              <td class="fw-bold">expected</td>
              <td class="fw-bold">actual</td>
              <td class="fw-bold">low</td>
              <td class="fw-bold">high</td>
            </tr>
          </thead>
          <tbody>
            @for(log of filteredLogs; track $index){
            <tr class="text-center" (click)="OnSend(log, ComponentForm)">
              <td>{{ log.date | date : 'y-M-d' }}</td>
              <td>{{ log.hour }}</td>
              <td>{{ log.num_carte }}</td>
              <td>{{ log.component }}</td>
              <td>{{ log.expected }}</td>
              <td>{{ log.actual }}</td>
              <td>{{ log.low }}</td>
              <td>{{ log.high }}</td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
<app-form #ComponentForm></app-form>
